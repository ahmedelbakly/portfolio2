<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Ahmed Elbakly — Senior Full-Stack Engineer</title>
    <link rel="canonical" href="https://ahmedelbakly.github.io/portfolio/en/" />

    <!--
      Language gateway.

      Every page lives under a locale segment so both languages can be indexed
      separately. A static host cannot issue a redirect, so `/` is a real file
      whose only job is to forward. It is deliberately not a Next route: the
      locale layout owns <html>, and a second root layout would nest one <html>
      inside another.

      The meta refresh covers clients without JavaScript. The script runs first
      for everyone else and honours a previously chosen language.
    -->
    <meta http-equiv="refresh" content="0; url=./en/" />
    <script>
      ;(function () {
        var target = 'en'
        try {
          var stored = localStorage.getItem('ae-lang')
          if (stored === 'en' || stored === 'ar') target = stored
          else if ((navigator.language || '').toLowerCase().indexOf('ar') === 0) target = 'ar'
        } catch (e) {}
        location.replace('./' + target + '/')
      })()
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #08090b;
        color: #a2a8b3;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #7c8cff;
      }
    </style>
  </head>
  <body>
    <p><a href="./en/">Continue to the site →</a></p>
  </body>
</html>
